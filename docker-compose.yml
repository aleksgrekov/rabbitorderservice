services:
  postgres:
    image: postgres
    container_name: orders_db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - ./worker_service/db:/var/lib/postgresql/data
#    healthcheck:
#      test: [ "CMD-SHELL", "pg_isready -U postgres -d weatherparser" ]
#      interval: 10s
#      timeout: 5s
#      retries: 5
#    networks:
#      - app_network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    hostname: rabbitmq
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    env_file:
      - .env
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

volumes:
  rabbitmq-data: